name: Build, test, and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      ACR_NAME: azassessmentdev36uah
      RESOURCE_GROUP: rg-azassessment-dev
      CONTAINER_APP: app-azassessment-dev
      IMAGE_NAME: azure-devops-assessment-api

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push image
        env:
          REGISTRY_LOGIN_SERVER: azassessmentdev36uah.azurecr.io
        run: |
          image="$REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA"
          docker build --tag "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy image to Azure Container Apps
        run: >-
          az containerapp update
          --name "$CONTAINER_APP"
          --resource-group "$RESOURCE_GROUP"
          --image "$IMAGE"
